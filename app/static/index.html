<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MedIntel 风险工作台</title>
  <style>
    :root { color-scheme: light; --ink:#18323b; --muted:#61747a; --line:#d9e4e3; --bg:#f5f8f7; --panel:#fff; --teal:#087f73; --red:#b33b35; --amber:#a86506; }
    * { box-sizing:border-box; } body { margin:0; font-family:Inter,Segoe UI,Microsoft YaHei,sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:24px 5vw 16px; background:#103c43; color:#f4fbf8; display:flex; justify-content:space-between; align-items:end; gap:20px; }
    h1 { margin:0; font-size:25px; letter-spacing:0; } header p { margin:5px 0 0; color:#b7d4cf; font-size:13px; } .badge { border:1px solid #5da69d; padding:8px 11px; font-size:12px; }
    main { max-width:1280px; margin:0 auto; padding:22px 5vw 42px; } .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
    button, select { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:9px 12px; border-radius:4px; cursor:pointer; } button.primary { background:var(--teal); color:#fff; border-color:var(--teal); }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; } .metric { background:var(--panel); border:1px solid var(--line); padding:15px; } .metric span { display:block; color:var(--muted); font-size:12px; } .metric strong { display:block; font-size:25px; margin-top:4px; }
    .layout { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(330px,.8fr); gap:16px; align-items:start; } .panel { background:var(--panel); border:1px solid var(--line); } .panel h2 { margin:0; padding:15px 17px; font-size:16px; border-bottom:1px solid var(--line); } .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:700px; } th,td { text-align:left; padding:12px 14px; border-bottom:1px solid #edf2f1; font-size:13px; white-space:nowrap; } th { color:var(--muted); font-size:11px; font-weight:600; } tbody tr { cursor:pointer; } tbody tr:hover { background:#f3faf8; }
    .risk { font-weight:700; } .critical,.high { color:var(--red); } .medium { color:var(--amber); } .low { color:var(--teal); } .factor { padding:11px 0; border-bottom:1px solid #edf2f1; display:flex; justify-content:space-between; gap:15px; font-size:13px; } .factor small { color:var(--muted); display:block; margin-top:3px; }
    .detail { padding:17px; min-height:370px; } .empty { color:var(--muted); font-size:14px; padding-top:35px; } .detail h3 { margin:0 0 5px; font-size:19px; } .detail .meta { color:var(--muted); font-size:12px; margin-bottom:17px; } .score { font-size:42px; font-weight:700; margin:8px 0 18px; } .actions { display:flex; gap:8px; margin-top:20px; flex-wrap:wrap; } .notice { margin-top:18px; padding:11px 12px; background:#edf7f4; color:#35625c; font-size:12px; line-height:1.5; }
    @media (max-width:900px) { .layout { grid-template-columns:1fr; } .summary { grid-template-columns:repeat(2,1fr); } header { align-items:start; flex-direction:column; } }
  </style>
</head>
<body>
  <header><div><h1>MedIntel 风险工作台</h1><p>医院集团患者安全与质量中枢 · 成人普通住院 · 24小时恶化风险</p></div><div class="badge" id="model">模型加载中</div></header>
  <main>
    <div class="toolbar"><select id="target"><option value="deterioration_24h">24小时恶化</option><option value="readmission_30d">30天再入院</option></select><select id="band"><option value="">全部风险</option><option value="critical">危急</option><option value="high">高风险</option><option value="medium">中风险</option><option value="low">低风险</option></select><button class="primary" id="refresh">刷新风险列表</button><span id="updated" style="color:var(--muted);font-size:12px"></span></div>
    <section class="summary"><div class="metric"><span>住院患者</span><strong id="total">-</strong></div><div class="metric"><span>高/危风险</span><strong id="high">-</strong></div><div class="metric"><span>待人工复核</span><strong id="review">-</strong></div><div class="metric"><span>模型状态</span><strong style="font-size:18px;color:var(--teal)">可用</strong></div></section>
    <div class="layout"><section class="panel"><h2>患者风险队列</h2><div class="table-wrap"><table><thead><tr><th>患者</th><th>科室</th><th>风险等级</th><th>概率</th><th>模型版本</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div></section><aside class="panel"><h2>风险详情</h2><div class="detail" id="detail"><div class="empty">选择左侧患者查看风险因素与人工处置状态。</div></div></aside></div>
    <div class="notice">演示环境：风险分数仅用于排序和人工复核，不构成诊断或治疗建议。生产上线前需完成院内数据治理、独立验证、亚组评估、临床前瞻性评估和安全审批。</div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id); let selected;
    const bandText = {critical:'危急',high:'高风险',medium:'中风险',low:'低风险'};
    // 演示令牌仅 APP_ENV=dev 有效；生产环境为 OIDC，此处会被 401 拒绝。
    const auth = {Authorization:'Bearer demo-clinician-token'}; const targetLabels = {deterioration_24h:'24小时恶化',readmission_30d:'30天再入院'};
    const safe = (value) => { const node = document.createElement('span'); node.textContent = value ?? ''; return node.innerHTML; };
    async function load() { const params = new URLSearchParams({target_id:$('target').value}); if ($('band').value) params.set('band',$('band').value); const response = await fetch(`/api/patients?${params}`, {headers:auth}); const data = await response.json(); $('total').textContent = data.length; $('high').textContent = data.filter(x => ['high','critical'].includes(x.risk?.band)).length; $('review').textContent = data.filter(x => x.risk?.status === 'new').length; $('rows').innerHTML = data.map(p => `<tr data-id="${safe(p.encounter_id)}"><td>${safe(p.display_name)}<br><small style="color:var(--muted)">${safe(p.patient_id)} · ${safe(p.age)}岁</small></td><td>${safe(p.department)}</td><td class="risk ${bandText[p.risk?.band] ? p.risk.band : ''}">${bandText[p.risk?.band] || '未评分'}</td><td>${p.risk ? (p.risk.score*100).toFixed(1)+'%' : '-'}</td><td>${safe(p.risk?.model_version)}</td><td>${safe(p.risk?.status)}</td></tr>`).join(''); document.querySelectorAll('tbody tr').forEach(row => row.onclick = () => show(row.dataset.id)); $('updated').textContent = `更新于 ${new Date().toLocaleTimeString()} · ${targetLabels[$('target').value]}`; const health = await fetch('/api/health'); const h = await health.json(); $('model').textContent = safe(h.models?.[$('target').value] || h.model_version); }
    async function show(id) { selected = id; const p = await (await fetch(`/api/patients/${encodeURIComponent(id)}`, {headers:auth})).json(); const r = p.risks?.[$('target').value] || p.risk; if (!r) { $('detail').innerHTML = '<div class="empty">暂无该目标的风险分数。</div>'; return; } $('detail').innerHTML = `<h3>${safe(p.display_name)}</h3><div class="meta">${safe(p.patient_id)} · ${safe(p.department)} · ${p.sex === 'M' ? '男' : '女'} · 入院 ${safe(new Date(p.admitted_at).toLocaleString())}</div><div class="score ${bandText[r.band] ? r.band : ''}">${(r.score*100).toFixed(1)}% <span style="font-size:14px">${bandText[r.band] || '未知'}</span></div><div style="font-size:12px;color:var(--muted)">目标：${safe(targetLabels[$('target').value])} · 主要触发因素</div>${r.top_factors.map(f => `<div class="factor"><div>${safe(f.label)}<small>${safe(f.feature)}: ${safe(f.value)}</small></div><strong class="${f.contribution > 0 ? 'high' : 'low'}">${f.contribution > 0 ? '+' : ''}${safe(f.contribution)}</strong></div>`).join('')}<div class="actions"><button onclick="review('acknowledged')">确认告警</button><button onclick="review('in_progress')">转入处置</button><button class="primary" onclick="review('resolved')">标记已解决</button></div>`; }
    async function review(status) { if (!selected) return; const note = status === 'resolved' ? '人工处置完成' : status === 'in_progress' ? '已通知责任团队' : '已人工确认'; await fetch(`/api/patients/${encodeURIComponent(selected)}/review`, {method:'POST', headers:{...auth,'Content-Type':'application/json'}, body:JSON.stringify({status,note,target_id:$('target').value})}); await load(); await show(selected); }
    $('refresh').onclick = load; $('band').onchange = load; $('target').onchange = load; load();
  </script>
</body>
</html>
