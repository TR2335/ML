name: medintel-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app scripts tests
      - run: ruff check app scripts tests
      - run: ruff format --check app scripts tests
      - run: pytest -q
      - run: python -m pip install pip-audit
      - run: pip-audit
      # POSTGRES_PASSWORD 为 :?required 强制项；校验用哑值，真实部署必须显式提供
      - run: POSTGRES_PASSWORD=ci docker compose config --quiet
