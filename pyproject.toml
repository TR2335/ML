[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medintel"
version = "0.1.0"
description = "Enterprise-ready clinical safety and quality ML vertical slice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "optuna>=4,<6",
]
train = [
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "optuna>=4,<6",
]
prod = [
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
  "redis>=5.0,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider -m 'not integration'"
markers = [
    "integration: requires docker compose --profile future-infra (PostgreSQL/Redis); run with -m integration",
    "slow: long-running end-to-end runs (scale rehearsal smoke); kept in default CI per spec",
]

[tool.ruff]
line-length = 100
target-version = "py311"
