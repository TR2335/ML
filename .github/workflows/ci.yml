name: medintel-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app scripts tests
      - run: ruff check app scripts tests
      - run: ruff format --check app scripts tests
      - run: pytest -q
      # data/*.json 不入库；--check 需先按默认参数复现工件（合成种子固定，见台账 Task 5）
      - run: python scripts/train_model.py --target-id deterioration_24h --output data/model.json
      - run: python scripts/train_model.py --target-id readmission_30d --output data/readmission_model.json
      - run: python scripts/make_golden.py --check
      - run: python -m pip install pip-audit
      - run: pip-audit
      # POSTGRES_PASSWORD 为 :?required 强制项；校验用哑值，真实部署必须显式提供
      - run: POSTGRES_PASSWORD=ci docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: POSTGRES_PASSWORD=ci docker compose --profile future-infra up -d --build
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            pg=$(docker compose --profile future-infra exec -T postgres pg_isready -U medintel -d medintel || true)
            redis=$(docker compose --profile future-infra exec -T redis redis-cli ping || true)
            echo "$pg $redis" | grep -q "accepting connections" && echo "$redis" | grep -q "PONG" && break
            sleep 2
          done
      - name: Verify services are ready
        run: |
          docker compose --profile future-infra exec -T postgres pg_isready -U medintel -d medintel
          docker compose --profile future-infra exec -T redis redis-cli ping | grep -q PONG
      - run: POSTGRES_PASSWORD=ci REDIS_URL=redis://127.0.0.1:6379/0 RUN_REDIS_FAILURE_TEST=1 pytest -m integration -v
      - if: always()
        run: POSTGRES_PASSWORD=ci docker compose --profile future-infra down -v
